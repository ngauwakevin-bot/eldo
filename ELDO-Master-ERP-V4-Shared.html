<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELDO Master ERP V4</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14231c;--mut:#5d6f66;--ac:#0f6b4f;--ac2:#e0f0e9;--bd:#d5ded9;--bad:#b3261e;--warn:#a86a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1713;--card:#16231d;--ink:#e6efe9;--mut:#93a89d;--ac:#3fc496;--ac2:#1d3a2e;--bd:#2a3d34;--bad:#ff8a80;--warn:#f0b44c}}
:root[data-theme="dark"]{--bg:#0e1713;--card:#16231d;--ink:#e6efe9;--mut:#93a89d;--ac:#3fc496;--ac2:#1d3a2e;--bd:#2a3d34;--bad:#ff8a80;--warn:#f0b44c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,'Times New Roman',serif}
h1,h2,h3,button,input,select,th,nav{font-family:'Trebuchet MS',Verdana,sans-serif}
h2{margin:0 0 12px;font-size:22px}h3{margin:16px 0 8px;font-size:16px}
button{background:var(--ac);color:var(--bg);border:0;border-radius:6px;padding:8px 13px;cursor:pointer;font-size:14px}
button.g{background:var(--ac2);color:var(--ink);border:1px solid var(--bd)}button.d{background:var(--bad);color:#fff}button:disabled{opacity:.4;cursor:not-allowed}
input,select{padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--ink);font-size:14px;max-width:100%}
.wrap{display:flex;min-height:100vh}nav{width:210px;background:var(--card);border-right:1px solid var(--bd);padding:12px;flex:none}
nav b{display:block;font-size:17px;color:var(--ac);margin-bottom:10px}nav a{display:block;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:14px}nav a:hover,nav a.on{background:var(--ac2)}
main{flex:1;padding:18px;min-width:0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
.c b{display:block;font-size:24px;font-family:'Trebuchet MS',sans-serif;color:var(--ac)}.c span{color:var(--mut);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;background:var(--card)}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{background:var(--ac2)}
.tag{padding:2px 8px;border-radius:10px;background:var(--ac2);font-size:12px}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.login{max-width:420px;margin:6vh auto;padding:20px}.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.box input{width:100%;margin-bottom:8px}.big{font:700 34px 'Trebuchet MS',monospace;letter-spacing:6px;color:var(--ac)}
#toast{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;display:none;z-index:9}
@media(max-width:700px){.wrap{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--bd)}nav b{display:none}nav a{white-space:nowrap}}
</style></head><body>

async function setFP(){try{if(!window.PublicKeyCredential)throw 0;const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(16)),rp:{name:'ELDO'},user:{id:crypto.getRandomValues(new Uint8Array(8)),name:'u',displayName:'u'},pubKeyCredParams:[{type:'public-key',alg:-7}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:20000}});tmp.fp=1;tmp.cid=Array.from(new Uint8Array(c.rawId))}catch(e){tmp.fp=1;tmp.sim=1;toast('No sensor available here: fingerprint recorded in demo mode')}

const SHAPE={users:[],students:[],teachers:[],staff:[],att:{},fin:[],tx:[],inv:[],lib:[],msgs:[],audit:[],apps:[],lock:{on:false,date:''},codes:[],fails:[],sess:[],cred:{}};
const U=CLOUD?CLOUD.replace(/\/+$/,'')+'/eldo.json':'';let snap={},ready=false,busy=false;
const cs=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.entries(x).filter(e=>e[1]!==null).sort((a,b)=>a[0]<b[0]?-1:1)):x);
const norm=(k,v)=>v==null?JSON.parse(JSON.stringify(SHAPE[k])):(Array.isArray(SHAPE[k])&&!Array.isArray(v)?Object.values(v):v);
const stat=t=>{const e=$('#st');if(e)e.textContent=t},keep=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
async function sync(){if(!U||busy)return;busy=true;try{
const r=await(await fetch(U)).json();
if(!ready){ready=true;if(r&&r.students){for(const k in SHAPE){D[k]=norm(k,r[k]);snap[k]=cs(D[k])}keep();render()}}
else{let c=0;for(const k in SHAPE){if(cs(D[k])!==snap[k])continue;const v=norm(k,r?r[k]:null),j=cs(v);if(j!==snap[k]){D[k]=v;snap[k]=j;c++}}
if(c){keep();if(!/INPUT|SELECT/.test((document.activeElement||{}).tagName||''))render()}}
const ch={};for(const k in SHAPE){if(cs(D[k])!==snap[k])ch[k]=D[k]}
if(Object.keys(ch).length){await fetch(U,{method:'PATCH',body:JSON.stringify(ch)});for(const k in ch)snap[k]=cs(ch[k])}
stat('☁ Online: shared school data')}catch(e){stat('Offline: working on this device, will sync when online')}busy=false}
load();stat(U?'Connecting…':'Local mode: this device only');if(U){sync();setInterval(sync,4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()})}
const m=location.hash.match(/code=(\d{6})/);if(m){S.mode='code';render();$('#cc').value=m[1]}else render();
</script></body></html>
